    <!--
      Paint the right theme + accent *before* first frame so there is no flash
      of the wrong palette. Inline, synchronous, ~30 lines, zero dependencies.
    -->
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var store = window.localStorage
          var savedTheme = store.getItem('ziqo:theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme = savedTheme || (prefersLight ? 'light' : 'dark')
          var accent = store.getItem('ziqo:accent') || 'lime'
          root.dataset.theme = theme
          root.dataset.accent = accent
          root.style.colorScheme = theme
          // Hint the browser about the background so overscroll never flashes white.
          root.style.backgroundColor = theme === 'light' ? '#f4f4f2' : '#060607'
        } catch (e) {
          /* private mode / blocked storage — defaults are fine */
        }
      })()
    </script>

    <style>
      /* Critical first-frame shell: keeps the boot from being a white void. */
      html { background: #060607 }
      html[data-theme='light'] { background: #f4f4f2 }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #6a6a72;
        z-index: 10;
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      #boot[data-done] { opacity: 0; visibility: hidden }
      #boot span { display: block; width: 34px; height: 2px; background: #c8fa4b; animation: bootslide 1.1s ease-in-out infinite }
      @keyframes bootslide { 0%, 100% { transform: scaleX(0.25); opacity: 0.4 } 50% { transform: scaleX(1); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { #boot span { animation: none } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><span></span>booting</div>
    <div id="root"></div>
